{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <title>
        {% block title %}
        {% endblock title %}
    </title>
</head>
<body>
    {% block header %}
    {% endblock header %}

    {% block navbar %}
        {% include 'navbar.html' %}
    {% endblock navbar %}

    <div class="content">
        {% block main %}
        {% endblock main %}
    </div>
</body>
</html>
