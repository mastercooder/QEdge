<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/student.css' %}">
    <title>{{title}}</title>
</head>
<body>
    <header>
        <h1>{{heading}}</h1>
        {% include "navbar.html" %}
    </header>
    <main>
        <h3>Form</h3>
        <form method="POST">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit">Submit</button>
            <button type="reset">Cancel</button>
        </form>
    </main>
</body>
</html>
