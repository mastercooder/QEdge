<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flex:CSS</title>
        <style>
            .container{
                display: flex;
                background-color: aqua;
                gap: 10px;
                flex-direction: row;
                justify-content: center;
            }
            .container > div{
                background-color: bisque;
                text-align: end;
                align-content:end;
                width: 100px;
                height: 50px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="item1">Flex1</div>
            <div class="item2">Flex2</div>
            <div class="item3">Flex3</div>
            <div class="item4">Flex4</div>
            <div class="item5">Flex5</div>
        </div>
    </body>
</html>
