<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid2: CSS</title>
    <style>
        .gridItem1{
            grid-area: header;
            height: 50px
        }
        .gridItem2{
            grid-area: menuItem;
            height: 30px;
            line-height: 30px;
        }
        .gridItem3{
            grid-area: left;
            height: 400px;
        }
        .gridItem4{
            grid-area: right;
        }
        .gridItem5{
            grid-area: footer1;
            height: 70px;
        }
        .gridItem6{
            grid-area: footer2;
        }
        .gridItem7{
            grid-area: footer3;
        }
        .container{
            display: grid;
            grid-template-areas: 'header header header header header header header header header header header header'
                                    'menuItem menuItem menuItem menuItem menuItem menuItem menuItem menuItem menuItem menuItem menuItem menuItem'
                                    'left left left right right right right right right right right right'
                                    'footer1 footer1 footer1 footer1 footer2 footer2 footer2 footer2 footer3 footer3 footer3 footer3';
            text-align: center;
            border: 2px solid blue;
            background-color: bisque;
            row-gap: 20px;
            column-gap: 10px;
            padding: 20px;
        }
        .container > div{
            background-color: aqua;
            padding: 10px;
            border: 2px solid darkblue;
        }
        .container > div > marquee > a{
            margin-right: 20px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 25px;
            font-weight: bolder;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        .container > div > img{
            height: 100px;
            width: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gridItem1">
            <a href="">Logo</a>
        </div>
        <div class="gridItem2">
            <marquee behavior="" direction="">
                <a href="">Python</a>
                <a href="">Java</a>
                <a href="">JavaScripts</a>
                <a href="">Notejs</a>
                <a href="">React</a>
                <a href="">Machine Learning</a>
                <a href="">Artificial Intelligence</a>
                <a href="">Django</a>
                <a href="">NLP</a>
            </marquee>
        </div>
        <div class="gridItem3">Left</div>
        <div class="gridItem4">
            <img src="" alt="">
            <img src="" alt="">
            <img src="" alt="">
            <img src="" alt="">
        </div>
        <div class="gridItem5">Footer1</div>
        <div class="gridItem6">Footer2</div>
        <div class="gridItem7">Footer3</div>
    </div>
</body>
</html>
