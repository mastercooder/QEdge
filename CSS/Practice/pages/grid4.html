<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid4: CSS</title>
    <style>
        .gridItem1{
            grid-area: header;
            padding: 10px;
        }
        .gridItem2{
            grid-area: left;
            height: 500px; 
        }
        .gridItem3{grid-area: main;}
        .gridItem4{grid-area: right;}
        .gridItem5{
            grid-area: footer;
            height: 90px;
        }
        .container{
            display: grid;
            grid-template-areas: 'header header header'
                                  'left main right'
                                  'footer footer footer';
            background-color: lightblue;
            grid-template-columns: 2fr 8fr 2fr; /* fr--- Fraction of Avalable Spaces*/
            gap: 5px;
            padding: 5px;
        }
        .container > div{
            background-color: burlywood;
            padding: 3px;
        }
        .container > div > ul > li{
            list-style-type: none;
            padding: 10px 0px;
        }
        .container > div > ul > li > a{
            text-decoration: none;
            color: red;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gridItem1">Header</div>
        <div class="gridItem2">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Contact</a></li>
                <li><a href="">Login</a></li>
                <li><a href="">SignUp</a></li>
            </ul>
        </div>
        <div class="gridItem3">Main</div>
        <div class="gridItem4">RightSideBar</div>
        <div class="gridItem5">Footer</div>
    </div>
</body>
</html>
