<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>List:CSS</title>
        <style>
            div{
                /* border: 1px solid blueviolet; */
                height: 250px;
                width: 80%;
                margin-left: auto;
                margin-right: auto;
            }
            ol{
                list-style-type: upper-roman;
                border: 2px solid red;
                width: 20%;
                background-color: aqua;
                float: left;
                margin-right: 10px;
            }
            ol > li{
                border: 1px solid blue;
                list-style-position: inside;
                background-color: bisque;
                height: 50px;
                line-height: 40px;
                color: red;
            }

        </style>
    </head>
    <body>
        <div>
        <ol>
            <li>Python</li>
            <li>Java</li>
            <li>JavaScript</li>
            <li>React</li>
        </ol>
        <ol>
            <li>Python</li>
            <li>Java</li>
            <li>JavaScript</li>
            <li>React</li>
        </ol>
        <ol>
            <li>Python</li>
            <li>Java</li>
            <li>JavaScript</li>
            <li>React</li>
        </ol>
        </div>
    </body>
</html>
