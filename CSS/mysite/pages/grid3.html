<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grid3:CSS</title>
        <style>
            .container{
                display: grid;
                grid-template-columns: auto auto auto auto;
                background-color: rgb(121, 121, 240);
                padding: 3px;
                width: 80%;
                margin-left: auto;
                margin-right: auto;
                margin-top: 50px;
            }
            .container > div{
                background-color: beige;
                border: 2px solid goldenrod;
                padding: 10px;
                font-size: 20px;
                text-align: center;
                height: 80px;
                line-height: 60px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="griditem1">Grid1</div>
            <div class="griditem1">Grid2</div>
            <div class="griditem1">Grid3</div>
            <div class="griditem1">Grid4</div>
            <div class="griditem1">Grid5</div>
            <div class="griditem1">Grid6</div>
            <div class="griditem1">Grid7</div>
            <div class="griditem1">Grid8</div>
            <div class="griditem1">Grid8</div>
            <div class="griditem1">Grid8</div>
            <div class="griditem1">Grid8</div>
            <div class="griditem1">Grid8</div>
        </div>
    </body>
</html>
