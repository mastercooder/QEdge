<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ElementTypes:CSS</title>
        <style>
            h1,h2,ul,li,p,a,u,ins,b{
                border:  1px solid red;
            }
        </style>
    </head>
    <body>
        <!-- Block level elements -->
        <h1>welcome</h1>
        <h1>welcome</h1>
        <h2>welcome</h2>
        <ul>
            <li>Python</li>
            <li>Python</li>
            <li>Python</li>
        </ul>
        <p>
            Lorem ipsum, dolor sit amet consectetur adipisicing elit. Voluptatum, deserunt!
        </p>
        <!-- inline level elements -->
        <a href="">HOME</a>
        <a href="">FacebooK</a>
        <u>welcome</u> <ins>welcome</ins>
        <b>welcome</b> 
    </body>
</html>
