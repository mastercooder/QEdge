<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flex2:CSS</title>
        <style>
            .container1{
                display: flex;
                background-color: bisque;
                margin-bottom: 10px;
            }
            .container1 > div{
                background-color: aqua;
                margin: 10px;
                padding: 10px;
            }
            .container2{
                display: flex;
                background-color: bisque;
                margin-bottom: 10px;
            }
            .container2 > div{
                background-color: aqua;
                margin: 10px;
                padding: 10px;
            }
            .container3{
                display: flex;
                background-color: bisque;
                margin-bottom: 10px;
            }
            .container3 > div{
                background-color: aqua;
                color: red;
                width: 100px;
                margin: 10px;
                padding: 10px;
                text-align: center;
                font-size: 25px;
            }
        </style>
    </head>
    <body>
        <div class="container1">
            <div style="order: 2;">Flex1</div>
            <div style="order: 3;">Flex2</div>
            <div style="order: 4;">Flex3</div>
            <div style="order: 5;">Flex4</div>
            <div style="order: 1;">Flex5</div>
        </div>
        <div class="container2">
            <div style="flex-grow: 1;">Flex1</div>
            <div style="flex-grow: 2;">Flex2</div>
            <div style="flex-grow: 4;">Flex3</div>
            <div style="flex-grow: 1;">Flex4</div>
            <div style="flex-grow: 2;">Flex5</div>
        </div>
        <div class="container3">
            <div>Flex1</div>
            <div>Flex2</div>
            <div>Flex3</div>
            <div>Flex4</div>
            <div style="flex-shrink: 20;">Flex5</div>
            <div>Flex6</div>
            <div>Flex7</div>
            <div>Flex8</div>
            <div>Flex9</div>
        </div>
    </body>
</html>
