<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid3: CSS</title>
    <style>
        .container{
            display: grid;
            grid-template-areas: 'auto auto auto auto';
            background-color: blue;
            padding: 3px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            margin-top: 50px;
        }
        .container > div{
            background-color: beige;
            border: 2px solid goldenrod;
            padding: 10px;
            font-size: 20px;
            text-align: center; 
            height: 80px;
            line-height: 70px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gridItem1">Grid1</div>
        <div class="gridItem2">Grid2</div>
        <div class="gridItem3">Grid3</div>
        <div class="gridItem4">Grid4</div>
        <div class="gridItem5">Grid5</div>
        <div class="gridItem6">Grid6</div>
        <div class="gridItem7">Grid7</div>
        <div class="gridItem8">Grid8</div>
        <div class="gridItem8">Grid8</div>
        <div class="gridItem8">Grid8</div>
        <div class="gridItem8">Grid8</div>
        <div class="gridItem8">Grid8</div>
    </div>
</body>
</html>
