<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table:HTML</title>
</head>

<body>
    <h1>Table Page</h1>
    <table>
        <caption>Student Information</caption>
        <thead>
            <th>SNO</th>
            <th>SNAME</th>
            <th>COURSE</th>
            <th>FEE</th>
        </thead>
        <tbody>
            <tr>
                <td>10001</td>
                <td>Tejesh</td>
                <td>Python</td>
                <td>17000</td>
            </tr>
            <tr>
                <td>10001</td>
                <td>Tejesh</td>
                <td>Python</td>
                <td>17000</td>
            </tr>
            <tr>
                <td>10001</td>
                <td>Tejesh</td>
                <td>Python</td>
                <td>17000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td></td>
                <td></td>
                <th>Total</td>
                <th>65000</td>
            </tr>
        </tfoot>
        <!-- <thead><tbody><tfoot> are used to set the position in the table. If <tfoot> will be put in first then also because of <tfoot> it will come automicaaly on the last. -->
    </table>
</body>

</html>
