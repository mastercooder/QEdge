<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuBar</title>
    <style>
        body{
            margin: 1px;
            padding: 0;
        }
        ul{
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: rgb(3, 3, 39);
            overflow: hidden;
        }
        ul > li{
            color: white;
            border: 1px solid white;
        }
        ul > li:last:nth-child{
            border-right: none;
        }
        ul > li > a{
            display: black;
        }
    </style>
</head>
<body>
    <ul>
        <li class="home">Home</li>
        <li class="about">About</li>
        <li class="contact">Contact</li>
        <li class="signin">signin</li>
    </ul>
</body>
</html>
