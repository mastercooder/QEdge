<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-2</title>
    <style>
        .griditem1{
            grid-area: header;
            height: 100px;
            border: 2px solid black;
            width: 100%;
        }
        .griditem2{
            grid-area: menuItems;
        }
        .griditem3{
            grid-area: left;
        }
        .griditem4{
            grid-area: main;
        }
        .griditem5{
            grid-area: footer1;
        }
        .griditem6{
            grid-area: footer2;
        }
        .griditem7{
            grid-area: footer3;
        }
        .container{
            display: grid;
            grid-template-areas: 'header header header header header header header header header header header header'
                                'menuItems menuItems menuItems menuItems menuItems menuItems menuItems menuItems menuItems menuItems menuItems menuItems'
                                'left left left main main main main main main main main main'
                                'fitem1 fitem1 fitem2 fitem2 fitem2 fitem2 fitem2 fitem3 fitem3 fitem3 fitem3 fitem3';
            text-align: center;
            border: 1px solid black;
            background-color: aqua;
            row-gap: 10px;
            column-gap: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="griditem1">Header</div>
        <div class="griditem2">MenuItems</div>
        <div class="griditem3">Left</div>
        <div class="griditem4">Main</div>
        <div class="griditem5">FItem1</div>
        <div class="griditem6">FItem2</div>
        <div class="griditem7">FItem3</div>
    </div>
</body>
</html>
